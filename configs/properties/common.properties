# SSL config for the FHIR Client
server.ssl.key-store = file:${SSL_KEYSTORE_PATH}
server.ssl.key-store-password = ${SSL_KEYSTORE_PASSWORD}
server.ssl.key-password = ${SSL_KEYSTORE_PASSWORD}
server.ssl.trust-store= file:${SSL_TRUSTSTORE_PATH}
server.ssl.trust-store-password=${SSL_TRUSTSTORE_PASSWORD}

#/usr/local/tomcat/webapps/OpenELIS-Global/certs
encryption.general.password=${SSL_KEYSTORE_PASSWORD}

# Co-Resdent FHIR Server
org.openelisglobal.fhirstore.uri=https://fhir.openelis.org:8443/fhir/
# Also the account OpenELIS logs in to GCC with (the poller reuses this pair; the local store ignores it)
org.openelisglobal.fhirstore.username=workflow_a_user
org.openelisglobal.fhirstore.password=123
org.openelisglobal.fhir.subscriber.allowHTTP=true

# Minutes between scheduled retries for failed FHIR exports. Lower values
# give faster recovery from outages but increase load on the partner FHIR
# server. 5 matches the historical default in RegisterFhirHooksTask; tune
# downward only after measuring partner capacity.
org.openelisglobal.fhir.subscriber.backup.interval=5

org.openelisglobal.fhir.transformOnStartup=false

#open client registry authentication
org.openelisglobal.crserver.uri=
org.openelisglobal.crserver.username=
org.openelisglobal.crserver.password=

# Remote FHIR server: GCC. Polled every remote.poll.frequency ms for Task{status=requested, owner=identifier}
# NOTE: https here needs configs/certs/gcc-ca.pem imported into ${SSL_TRUSTSTORE_PATH} at deploy time,
# and the webapp restarted afterwards. OpenELIS ignores the OS trust list and reads that one file once
# at startup, so without the import this poll fails the TLS handshake silently. See configs/certs/README.md.
org.openelisglobal.remote.source.uri=https://services.genetico.in:8084/dispatch/fhir/
# true = write accepted/rejected back to GCC after import. Required: otherwise the Task stays
# `requested` and the same order is re-imported on every poll
org.openelisglobal.remote.source.updateStatus=true
# what this lab is called on GCC - matches gccirculus.fhir.labOwnerId, byte for byte.
# A mismatch fails silently: GCC serves a valid empty Bundle and the log just says
# "received bundle with 0 entries", so change this and the GCC property together.
#
# MUST BE A UUID. Accessioning reaches LabOrderSearchProvider.addRequester, which for an
# order carrying no Practitioner does, unguarded:
#     getProviderByFhirId(UUID.fromString(task.getOwner().getReferenceElement().getIdPart()))
# The previous value "aiimsd-labs" is not a UUID, so every accessioning attempt died with
#     java.lang.IllegalArgumentException: Invalid UUID string: aiimsd-labs
#       at LabOrderSearchProvider.addRequester(LabOrderSearchProvider.java:418)
# surfacing as a 500 on ajaxQueryXML and an empty Patient form. Confirmed from the server
# trace on 2026-10-07. With a real UUID the lookup returns no Provider and the screen
# carries on normally.
#
# Do NOT change this through Admin > Application Properties. CommonPropertiesController
# only mutates the in-memory Spring Environment - it writes nothing to disk - so the edit
# never reaches FhirConfig (which binds @Value at startup) and is discarded by the restart
# that would have applied it. This file is the only place it takes effect.
org.openelisglobal.remote.source.identifier=Organization/bfaa39ba-491a-458f-b03b-a283d2f132d6
org.openelisglobal.remote.poll.frequency=5000
org.openelisglobal.task.useBasedOn=true

org.openelisglobal.fhir.subscriber=
org.openelisglobal.fhir.subscriber.resources=Task,Patient,ServiceRequest,DiagnosticReport,Observation,Specimen,Practitioner,Encounter

